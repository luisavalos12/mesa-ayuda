<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 700px;">
    <h1 class="h3 mb-4">Editar ticket MAT-{{ "%03d"|format(ticket['id']) }}</h1>
    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post" class="bg-white p-4 shadow-sm rounded">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input name="titulo" class="form-control" value="{{ ticket['titulo'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción del problema</label>
        <textarea name="descripcion" class="form-control" rows="4" required>{{ ticket['descripcion'] }}</textarea>
      </div>
      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Categoría</label>
          <select name="categoria" class="form-select">
            {% for c in categorias %}
            <option value="{{ c }}" {% if ticket['categoria'] == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col mb-3">
          <label class="form-label">Prioridad</label>
          <select name="prioridad" class="form-select">
            {% for p in prioridades %}
            <option value="{{ p }}" {% if ticket['prioridad'] == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <button class="btn btn-primary">Guardar cambios</button>
      <a href="{{ url_for('detalle', ticket_id=ticket['id']) }}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</body>
</html>
