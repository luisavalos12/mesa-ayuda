<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar técnico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 700px;">
    <h1 class="h4 mb-3">Registrar técnico</h1>

    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}<div class="alert alert-danger">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form method="post" class="bg-white p-4 shadow-sm rounded">
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
      </div>
<div class="mb-3">
    <label class="form-label">Apellidos</label>
    <input type="text" name="apellidos" class="form-control" required>
</div>
<div class="mb-3">
    <label class="form-label">Correo</label>
    <input type="email" name="correo" class="form-control" required>
</div>
<p class="text-muted">El usuario se genera solo con tu nombre y apellidos.</p>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
     <div class="mb-3">
  <label class="form-label">Rol</label>
  <select name="rol" class="form-select">
    <option value="admin">Maestro</option>
    <option value="tecnico">Técnico</option>
    <option value="usuario">Usuario de departamento</option>
  </select>
</div>
<div class="mb-3">
  <label class="form-label">Departamento</label>
  <select name="departamento" class="form-select">
    {% for d in departamentos %}
    <option>{{ d }}</option>
    {% endfor %}
  </select>
</div> 
      <button type="submit" class="btn btn-primary">Registrar técnico</button>
      <a href="{{ url_for('inicio') }}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</body>
</html>
