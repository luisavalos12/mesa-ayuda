<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 700px;">
    <h1 class="h3 mb-4">Nuevo ticket</h1>
    {% with mensajes = get_flashed_messages() %}
  {% for m in mensajes %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
{% endwith %}
    <form method="post" class="bg-white p-4 shadow-sm rounded">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input name="titulo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descripción del problema</label>
        <textarea name="descripcion" class="form-control" rows="4" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Usuario que reporta</label>
        <input name="usuario" class="form-control" required>
      </div>
      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Categoría</label>
          <select name="categoria" class="form-select">
            <option>Hardware</option>
            <option>Software</option>
            <option>Red</option>
            <option>Cuentas y accesos</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="col mb-3">
          <label class="form-label">Prioridad</label>
          <select name="prioridad" class="form-select">
            <option>Baja</option>
            <option selected>Media</option>
            <option>Alta</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary">Crear ticket</button>
      {% if session.get('usuario_id') %}
<a href="{{ url_for('inicio') }}" class="btn btn-link">Cancelar</a>
{% else %}
<a href="{{ url_for('login') }}" class="btn btn-link">Cancelar</a>
{% endif %}

    </form>
  </div>
</body>
</html>
